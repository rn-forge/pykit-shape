# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: CI

# validate → plan → verify, postgres, redis, smoke, suites → sonar → release → external-install, docs.
#
# validate: the repository-wide checks (lint, adapters, docs build), once.
# plan:     reads the uv workspace and selects the changed packages and their
#           dependents, as the outputs every later job reads.
# verify:   one job per selected package — lint, typecheck and test that member.
# postgres, redis, smoke, suites: the jobs a package or the workspace declares —
#           tests against PostgreSQL, tests against Redis, one extra installed
#           alone, workspace-wide pytest.
# sonar:    the scan, once verify, postgres, redis and smoke have passed.
# release:  the selected packages whose checks all passed, in dependency order,
#           each on its own `<package>-v<version>` tag.
# external-install: installs each new tag from git, outside the workspace.
# docs:     deploys each released package's versioned site and the root site to Pages.
#
# Every step goes through `task`; `kiln doctor`'s ci-entrypoint rule fails the
# build if a step invokes uv/pytest/ruff/pyright/mkdocs/kiln directly. kiln runs
# here only as the version `[kiln] ref` pins, read-only, through
# `task validate`: it checks the tree against the committed
# .rn-forge/kiln/state.json and never runs `kiln apply`.
#
# The repeated toolchain setup lives in .github/actions/setup, committed beside
# this file. Each job checks out first: GitHub can only run a local action from
# the checked-out tree. Every `uses:` is pinned to a commit SHA with the version
# in a trailing comment. Pins move in kiln (cicd/pins.toml), not here; Dependabot
# (.github/dependabot.yml, also generated) watches only the repository's own
# actions and its uv dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI resolves the committed lock and never rewrites it. Without this a stale
  # uv.lock passes CI against a resolution nobody committed.
  UV_LOCKED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Validate
        run: task lint
        env:
          KILN_DOCTOR_FULL: ${{ ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'workflow_dispatch') && '1' || '' }}

      - name: Check adapters
        run: task ci:adapters

      - name: Build docs
        run: task docs:build

  # Fails a pull request that adds a dependency with a known vulnerability, from
  # GitHub's dependency graph. Skipped on a push, which `ci-ok` treats as a pass.
  dependency-review:
    needs: validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release-order: ${{ steps.plan.outputs.release-order }}
      packages: ${{ steps.plan.outputs.packages }}
      postgres: ${{ steps.plan.outputs.postgres }}
      redis: ${{ steps.plan.outputs.redis }}
      smoke: ${{ steps.plan.outputs.smoke }}
      suites: ${{ steps.plan.outputs.suites }}
      pytest-args: ${{ steps.plan.outputs.pytest-args }}
      cov-args: ${{ steps.plan.outputs.cov-args }}
      test-paths: ${{ steps.plan.outputs.test-paths }}
      sonar-sources: ${{ steps.plan.outputs.sonar-sources }}
      sonar-tests: ${{ steps.plan.outputs.sonar-tests }}
      sonar: ${{ steps.plan.outputs.sonar }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: task ci:plan >> "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.name }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Verify
        env:
          PACKAGE_DIR: ${{ matrix.dir }}
          PYTEST_ARGS: ${{ needs.plan.outputs.pytest-args }}
        run: task ci:verify -- ${{ matrix.name }}

      - name: Record the check
        run: mkdir ok && touch "ok/${{ matrix.name }}.verify"

      - name: Upload the check marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.name }}.verify
          path: ok/
          retention-days: 1

  # For a package with `[tool.workspace-ci.postgres]`: its tests again, with the
  # DSN in the environment variable it names.
  postgres:
    name: postgres (${{ matrix.name }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.postgres != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.postgres) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Test against PostgreSQL
        env:
          PACKAGE_DIR: ${{ matrix.dir }}
          DSN_VAR: ${{ matrix.env }}
          PYTEST_ARGS: ${{ needs.plan.outputs.pytest-args }}
        run: task ci:postgres -- ${{ matrix.name }}

      - name: Record the check
        run: mkdir ok && touch "ok/${{ matrix.name }}.postgres"

      - name: Upload the check marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.name }}.postgres
          path: ok/
          retention-days: 1

  # For a package with `[tool.workspace-ci.redis]`: its tests again, with the
  # URL in the environment variable it names.
  redis:
    name: redis (${{ matrix.name }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.redis != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.redis) }}
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Test against Redis
        env:
          PACKAGE_DIR: ${{ matrix.dir }}
          URL_VAR: ${{ matrix.env }}
          PYTEST_ARGS: ${{ needs.plan.outputs.pytest-args }}
        run: task ci:redis -- ${{ matrix.name }}

      - name: Record the check
        run: mkdir ok && touch "ok/${{ matrix.name }}.redis"

      - name: Upload the check marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.name }}.redis
          path: ok/
          retention-days: 1

  # Every other job syncs everything, which hides an extra that forgets a
  # dependency another extra brings. Each extra is installed alone, from the
  # built wheel's metadata, into a clean venv and imported.
  smoke:
    name: smoke (${{ matrix.marker }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.smoke != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and import
        env:
          EXTRA: ${{ matrix.extra }}
        run: task ci:smoke -- ${{ matrix.name }}

      - name: Record the check
        run: mkdir ok && touch "ok/${{ matrix.marker }}"

      - name: Upload the check marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.marker }}
          path: ok/
          retention-days: 1

  # Workspace-wide pytest runs from the root `[tool.workspace-ci.suites]`.
  suites:
    name: suite (${{ matrix.name }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.suites != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Run the suite
        env:
          SUITE_ARGS: ${{ matrix.args }}
        run: task ci:suite

  sonar:
    needs: [validate, verify, postgres, redis, smoke]
    # The scan runs on a same-repository pull request and on main, nowhere else.
    # A fork's pull request cannot see SONAR_TOKEN, and SonarQube Cloud's free
    # plan keeps no readable result for any other branch, so the quality-gate
    # wait fails there. Validation stays required; the scan is skipped.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      # A push or dispatch names its branch (main, by the job's `if`), so the
      # analysis lands on it explicitly. A pull request keeps the scanner's own
      # detection. A tag has no branch to analyse.
      - name: Resolve the analysis target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: task ci:sonar-target >> "$GITHUB_OUTPUT"

      - name: Test with coverage
        run: task test:coverage

      # `sonar.qualitygate.wait` is what makes the gate a gate: without it the
      # job succeeds on *submitting* the analysis, and a release can ship while
      # Sonar is still deciding it failed.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            ${{ steps.target.outputs.branch-arg }}

  # Tags created with GITHUB_TOKEN start no workflow, so every release is created
  # here, prerequisites first, only on a push to the default branch and after
  # the quality gate. A failed check blocks its package and every selected
  # package that depends on it; with Sonar on, it blocks the whole run.
  release:
    needs: [validate, plan, verify, postgres, redis, smoke, sonar]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.release-order != '[]' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.sonar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the check markers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ok-*
          merge-multiple: true
          path: ok/

      - name: Build releases
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED: ${{ needs.plan.outputs.release-order }}
        run: task ci:release-build

      # Attested before anything is published, because the release, not the
      # tag, is the record: a failure here leaves nothing published, and a
      # rerun attests again. Skipped when every package was already released.
      - name: Generate provenance
        if: steps.build.outputs.built != '0'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*/*.whl
            dist/*/*.tar.gz
            dist/*/*.cdx.json

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED: ${{ needs.plan.outputs.release-order }}
        run: task ci:release-publish

  # Package checks resolve internal dependencies from the workspace, which
  # never proves a tag installs on its own.
  external-install:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify remote tags and clean installs
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: task ci:external-install

  # Runs on a push with no package change too, when `release` is skipped. The one
  # job that deploys Pages for a workspace: a root-only deploy landing after it
  # would remove the package sites, so there is no separate docs.yml.
  docs:
    needs: [validate, plan, release]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.release.result != 'failure' && needs.plan.outputs.docs == 'true' && github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write # mike pushes gh-pages
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Deploy the package sites and build the root site
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: task ci:docs-publish

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The only check branch protection requires. Job and matrix names change as
  # the repo grows; this one does not. A skipped job (the fork-guarded scan, a
  # release on a pull request) is not a failure.
  ci-ok:
    needs: [validate, dependency-review, plan, verify, postgres, redis, smoke, suites, sonar, release, external-install, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
